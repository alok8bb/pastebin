services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8080/api/v1
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pastebin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/pastebin?sslmode=disable
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pastebin
      POSTGRES_USER: pastebin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pastebin -d pastebin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
